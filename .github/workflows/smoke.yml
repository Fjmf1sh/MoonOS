name: Smoke install round trip

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  install-round-trip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run install/update/uninstall smoke test
        run: bash scripts/smoke-install-roundtrip.sh
