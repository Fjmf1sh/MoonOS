<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Moon OS font policy: a predictable sans-serif for all UI text, with the
     color-emoji font appended as a universal last-resort fallback so icon
     glyphs never render as empty boxes. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Append the emoji font to every request so any font missing an icon
       glyph falls back to it. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
