# Moon OS update configuration.
#
# The "Update" button in System settings runs /usr/lib/moonos/update.sh, which
# can do two things:
#   1. Upgrade base OS packages (apt).  Works out of the box.
#   2. Update Moon Shell itself from a GitHub release.  OFF until you set a
#      repository below and publish releases (see scripts/package-update.sh
#      and the README "Updates" section).

# Upgrade Debian / Raspberry Pi OS packages during an update (1 = yes).
DO_APT=1

# GitHub "owner/repo" that publishes Moon OS shell releases. Leave empty to
# disable shell self-update (OS package upgrades still run). When set, the
# updater looks for these assets on the repo's *latest* release:
#     version                 (a plain text version string, e.g. 2026.07.10)
#     moon-shell-arm64        (the compiled aarch64 binary)
#     moon-shell-arm64.sha256 (its "<sha256>  moon-shell-arm64" checksum)
MOONOS_UPDATE_REPO="Fjmf1sh/MoonOS"
